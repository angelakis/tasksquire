name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Pin the sync server version for reproducible builds.
# Update this when upgrading — check compatibility with Taskwarrior 3.x.
# Available tags: https://github.com/GothenburgBitFactory/taskchampion-sync-server/pkgs/container/taskchampion-sync-server
#
# NOTE: GitHub Actions does not support env vars in services.image, so the
# version is repeated in each job's services block. Keep them in sync.

env:
  SYNC_TEST_SERVER_URL: "http://localhost:8080"

jobs:
  sync-integration:
    name: Sync Integration Tests
    runs-on: ubuntu-latest

    services:
      sync-server:
        image: ghcr.io/gothenburgbitfactory/taskchampion-sync-server:0.7.1
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wait for sync server
        run: |
          echo "Waiting for taskchampion-sync-server on port 8080..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '' "$SYNC_TEST_SERVER_URL/" 2>/dev/null; then
              echo "Sync server is ready (attempt $i)"
              exit 0
            fi
            echo "  Not ready yet (attempt $i/30)..."
            sleep 2
          done
          echo "ERROR: Sync server did not start in 60 seconds"
          exit 1

      - name: Run unit and integration tests
        run: ./gradlew testDebugUnitTest

  cross-client:
    name: Cross-Client Compatibility (Taskwarrior)
    runs-on: ubuntu-latest

    services:
      sync-server:
        image: ghcr.io/gothenburgbitfactory/taskchampion-sync-server:0.7.1
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - name: Install Taskwarrior 3 via Snap
        run: |
          sudo snap install simpoir-taskwarrior3
          sudo snap alias simpoir-taskwarrior3.task task
          task --version

      - name: Wait for sync server
        run: |
          echo "Waiting for taskchampion-sync-server on port 8080..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '' "$SYNC_TEST_SERVER_URL/" 2>/dev/null; then
              echo "Sync server is ready (attempt $i)"
              exit 0
            fi
            echo "  Not ready yet (attempt $i/30)..."
            sleep 2
          done
          echo "ERROR: Sync server did not start in 60 seconds"
          exit 1

      - name: Run cross-client tests
        run: |
          chmod +x scripts/test-cross-client.sh
          ./scripts/test-cross-client.sh

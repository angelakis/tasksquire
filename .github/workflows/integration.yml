name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-integration:
    name: Sync Integration Tests
    runs-on: ubuntu-latest

    services:
      sync-server:
        image: ghcr.io/gothenburgbitfactory/taskchampion-sync-server:latest
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wait for sync server
        run: |
          echo "Waiting for taskchampion-sync-server on port 8080..."
          for i in $(seq 1 30); do
            # The server may return 404 on root; any TCP response means it's up
            if curl -s -o /dev/null -w '' http://localhost:8080/ 2>/dev/null; then
              echo "Sync server is ready (attempt $i)"
              exit 0
            fi
            echo "  Not ready yet (attempt $i/30)..."
            sleep 2
          done
          echo "ERROR: Sync server did not start in 60 seconds"
          exit 1

      - name: Run unit and integration tests
        env:
          SYNC_TEST_SERVER_URL: http://localhost:8080
        run: ./gradlew testDebugUnitTest

  cross-client:
    name: Cross-Client Compatibility (Taskwarrior)
    runs-on: ubuntu-latest

    services:
      sync-server:
        image: ghcr.io/gothenburgbitfactory/taskchampion-sync-server:latest
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Taskwarrior 3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgnutls28-dev uuid-dev

      - name: Build and install Taskwarrior 3
        run: |
          git clone --depth 1 https://github.com/GothenburgBitFactory/taskwarrior.git /tmp/taskwarrior
          cd /tmp/taskwarrior
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          sudo cmake --install build
          task --version

      - name: Wait for sync server
        run: |
          echo "Waiting for taskchampion-sync-server on port 8080..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '' http://localhost:8080/ 2>/dev/null; then
              echo "Sync server is ready (attempt $i)"
              exit 0
            fi
            echo "  Not ready yet (attempt $i/30)..."
            sleep 2
          done
          echo "ERROR: Sync server did not start in 60 seconds"
          exit 1

      - name: Run cross-client tests
        env:
          SYNC_TEST_SERVER_URL: http://localhost:8080
        run: |
          chmod +x scripts/test-cross-client.sh
          ./scripts/test-cross-client.sh

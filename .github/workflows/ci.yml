name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The JDK, Android SDK and aapt2 come from flake.lock, the same as a local `nix run`, so builds match.
      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # An unsigned release build, to catch R8 and build errors; only release.yml signs APKs.
      - name: Build release APK
        run: nix run . -- assembleRelease

      # TODO: Re-enable once sync tests are fixed
      # - name: Run unit tests
      #   run: nix run . -- test

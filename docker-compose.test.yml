# Docker Compose for running integration tests against taskchampion-sync-server.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   SYNC_TEST_SERVER_URL=http://localhost:8080 ./gradlew testDebugUnitTest
#   docker compose -f docker-compose.test.yml down
#
# Or use the helper script:
#   ./scripts/test-integration.sh

services:
  sync-server:
    image: ghcr.io/gothenburgbitfactory/taskchampion-sync-server:latest
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info

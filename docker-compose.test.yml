# Docker Compose for running integration tests against taskchampion-sync-server.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   ./gradlew test -Psync.test.server.url=http://localhost:8080
#   docker compose -f docker-compose.test.yml down
#
# Or use the helper script:
#   ./scripts/test-integration.sh

services:
  sync-server:
    image: ghcr.io/gothenburgbitfactory/taskchampion-sync-server:latest
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      # The server stores data in memory by default; no persistent volume needed for tests.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 2s
      timeout: 5s
      retries: 10
